<!DOCTYPE html>
<html>
<head><meta charset="utf-8" /></head>
<body>
<script>
  // Hidden recorder: mic → 16kHz mono Float32 → WAV → main process.
  let ctx = null, stream = null, node = null, chunks = [];

  const WORKLET_URL = URL.createObjectURL(new Blob([`
    class PCMCollector extends AudioWorkletProcessor {
      process(inputs) {
        const ch = inputs[0] && inputs[0][0];
        if (ch) this.port.postMessage(new Float32Array(ch));
        return true;
      }
    }
    registerProcessor("pcm-collector", PCMCollector);
  `], { type: "application/javascript" }));

  async function start() {
    chunks = [];
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
    ctx = new AudioContext({ sampleRate: 16000 });
    await ctx.audioWorklet.addModule(WORKLET_URL);
    node = new AudioWorkletNode(ctx, "pcm-collector");
    node.port.onmessage = (e) => chunks.push(e.data);
    ctx.createMediaStreamSource(stream).connect(node);
  }

  async function stop() {
    if (!ctx) return null;
    await new Promise((r) => setTimeout(r, 120)); // catch trailing audio
    node && node.disconnect();
    stream && stream.getTracks().forEach((t) => t.stop());
    await ctx.close();
    const total = chunks.reduce((n, c) => n + c.length, 0);
    const pcm = new Float32Array(total);
    let off = 0;
    for (const c of chunks) { pcm.set(c, off); off += c.length; }
    ctx = stream = node = null; chunks = [];
    return encodeWav(pcm, 16000);
  }

  function encodeWav(f32, rate) {
    const buf = new ArrayBuffer(44 + f32.length * 2);
    const v = new DataView(buf);
    const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    str(0, "RIFF"); v.setUint32(4, 36 + f32.length * 2, true); str(8, "WAVE");
    str(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
    v.setUint16(22, 1, true); v.setUint32(24, rate, true);
    v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, "data"); v.setUint32(40, f32.length * 2, true);
    for (let i = 0; i < f32.length; i++) {
      const s = Math.max(-1, Math.min(1, f32[i]));
      v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }
    return buf;
  }

  window.sudovoice.onRecStart(async () => {
    try { await start(); }
    catch (err) { window.sudovoice.sendRecError("mic: " + err.message); }
  });
  window.sudovoice.onRecStop(async () => {
    try {
      const wav = await stop();
      if (wav) window.sudovoice.sendRecData(wav);
      else window.sudovoice.sendRecError("no audio captured");
    } catch (err) { window.sudovoice.sendRecError("rec: " + err.message); }
  });
</script>
</body>
</html>
