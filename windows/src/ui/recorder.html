<!DOCTYPE html>
<html>
<head><meta charset="utf-8" /></head>
<body>
<script>
  // Hidden recorder: persistent warm mic + VAD chunking.
  // Speech is cut at natural pauses (>=600ms of silence) and each chunk is sent
  // to main immediately, so transcription overlaps speaking instead of waiting
  // for the hotkey release. The mic pipeline stays open for WARM_MS after the
  // last dictation so back-to-back dictations start instantly.
  const WARM_MS = 60000;
  const SILENCE_CUT_MS = 600;   // pause length that closes a chunk
  const MIN_SPEECH_MS = 300;    // don't emit chunks with less voiced audio
  const MAX_CHUNK_MS = 15000;   // force a cut so no chunk grows unbounded
  const PREROLL_MS = 250;       // silence kept before speech onset

  let ctx = null, stream = null, node = null, warmTimer = null;
  let recording = false;
  let frames = [], seq = 0, chunkMs = 0, voicedMs = 0, silenceMs = 0, totalMs = 0;
  let noiseFloor = 0.004;       // adaptive; threshold = max(0.006, 3x floor)

  const WORKLET_URL = URL.createObjectURL(new Blob([`
    class PCMCollector extends AudioWorkletProcessor {
      process(inputs) {
        const ch = inputs[0] && inputs[0][0];
        if (ch) this.port.postMessage(new Float32Array(ch));
        return true;
      }
    }
    registerProcessor("pcm-collector", PCMCollector);
  `], { type: "application/javascript" }));

  async function ensurePipeline() {
    clearTimeout(warmTimer);
    if (ctx) { if (ctx.state === "suspended") await ctx.resume(); return; }
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
    ctx = new AudioContext({ sampleRate: 16000 });
    await ctx.audioWorklet.addModule(WORKLET_URL);
    node = new AudioWorkletNode(ctx, "pcm-collector");
    node.port.onmessage = (e) => onFrame(e.data);
    ctx.createMediaStreamSource(stream).connect(node);
  }

  function releasePipeline() {
    if (!ctx) return;
    node && node.disconnect();
    stream && stream.getTracks().forEach((t) => t.stop());
    ctx.close();
    ctx = stream = node = null;
  }

  function rms(f32) {
    let s = 0;
    for (let i = 0; i < f32.length; i++) s += f32[i] * f32[i];
    return Math.sqrt(s / f32.length);
  }

  function onFrame(f32) {
    if (!recording) return;
    const ms = (f32.length / 16000) * 1000;
    frames.push(f32); chunkMs += ms; totalMs += ms;
    const threshold = Math.max(0.006, noiseFloor * 3);
    if (rms(f32) >= threshold) {
      voicedMs += ms; silenceMs = 0;
    } else {
      silenceMs += ms;
      noiseFloor = noiseFloor * 0.995 + rms(f32) * 0.005;
    }
    if ((silenceMs >= SILENCE_CUT_MS && voicedMs >= MIN_SPEECH_MS) || chunkMs >= MAX_CHUNK_MS) {
      emitChunk();
    } else if (silenceMs >= 2000 && voicedMs < MIN_SPEECH_MS) {
      // Long pure silence: drop the dead air, keep a short pre-roll for onset.
      const keep = Math.ceil((PREROLL_MS / 1000) * 16000 / 128);
      frames = frames.slice(-keep);
      chunkMs = frames.length * (128 / 16000) * 1000;
    }
  }

  function emitChunk() {
    if (voicedMs >= MIN_SPEECH_MS && frames.length) {
      const total = frames.reduce((n, c) => n + c.length, 0);
      const pcm = new Float32Array(total);
      let off = 0;
      for (const c of frames) { pcm.set(c, off); off += c.length; }
      window.sudovoice.sendRecChunk(encodeWav(pcm, 16000), { seq: seq++ });
    }
    frames = []; chunkMs = 0; voicedMs = 0; silenceMs = 0;
  }

  function encodeWav(f32, rate) {
    const buf = new ArrayBuffer(44 + f32.length * 2);
    const v = new DataView(buf);
    const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    str(0, "RIFF"); v.setUint32(4, 36 + f32.length * 2, true); str(8, "WAVE");
    str(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
    v.setUint16(22, 1, true); v.setUint32(24, rate, true);
    v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, "data"); v.setUint32(40, f32.length * 2, true);
    for (let i = 0; i < f32.length; i++) {
      const s = Math.max(-1, Math.min(1, f32[i]));
      v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }
    return buf;
  }

  window.sudovoice.onRecStart(async () => {
    try {
      frames = []; seq = 0; chunkMs = 0; voicedMs = 0; silenceMs = 0; totalMs = 0;
      await ensurePipeline();
      recording = true;
    } catch (err) {
      window.sudovoice.sendRecError("mic: " + err.message);
    }
  });

  window.sudovoice.onRecStop(async () => {
    try {
      if (!recording && !ctx) { window.sudovoice.sendRecError("no audio captured"); return; }
      // 450ms stop-grace: keep capturing after the stop gesture so the last
      // word is never clipped (matches the Mac AudioCaptureService).
      await new Promise((r) => setTimeout(r, 450));
      recording = false;
      emitChunk();
      window.sudovoice.sendRecDone({ seconds: totalMs / 1000, chunks: seq });
      warmTimer = setTimeout(releasePipeline, WARM_MS);
    } catch (err) {
      window.sudovoice.sendRecError("rec: " + err.message);
    }
  });
</script>
</body>
</html>
