appId: com.sudovoice.app
productName: SudoVoice
copyright: © 2026 AiwithVishal — AGPL-3.0
artifactName: SudoVoice-Setup.${ext}

directories:
  output: dist
  buildResources: build

# uiohook-napi ships N-API prebuilds — never node-gyp rebuild (needs no VS toolchain)
npmRebuild: false

files:
  - src/**/*
  - package.json

asarUnpack:
  - "**/node_modules/uiohook-napi/**"

win:
  target: nsis
  icon: build/icon.png

nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  runAfterFinish: true
