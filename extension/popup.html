<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body {
    width: 280px; margin: 0; padding: 16px;
    background: #04070F; color: #D7E2EC;
    font: 13px/1.5 Consolas, "Cascadia Code", monospace;
  }
  h1 { font-size: 14px; color: #00E676; margin: 0 0 2px; }
  .sub { color: #6B7A8C; font-size: 11px; margin-bottom: 14px; }
  button {
    width: 100%; padding: 10px; border: 0; border-radius: 6px;
    background: #00E676; color: #04170C; font: inherit; font-weight: 700;
    cursor: pointer; margin-bottom: 10px;
  }
  label { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
  select {
    background: #0A1220; color: #00E676; border: 1px solid rgba(0,230,118,0.25);
    border-radius: 6px; padding: 4px 8px; font: inherit;
  }
  .hint { color: #6B7A8C; font-size: 11px; border-top: 1px solid rgba(0,230,118,0.12); padding-top: 10px; margin-top: 4px; }
  .hint b { color: #4FC3F7; font-weight: 600; }
  a { color: #00E676; text-decoration: none; }
</style>
</head>
<body>
  <h1>sudovoice</h1>
  <div class="sub">voice typing in this tab</div>

  <button id="toggle">Start / stop dictation</button>

  <label><span>Language</span>
    <select id="lang">
      <option value="en-IN">English (India)</option>
      <option value="en-US">English (US)</option>
      <option value="hi-IN">Hindi</option>
    </select>
  </label>

  <div class="hint">
    Shortcut: <b>Alt+Shift+V</b> · <b>Esc</b> stops.<br />
    Browser dictation uses Chrome's speech service. For 100% offline,
    <a href="https://sudovoice.com" target="_blank">get the desktop app</a>.
  </div>
<script src="popup.js"></script>
</body>
</html>
