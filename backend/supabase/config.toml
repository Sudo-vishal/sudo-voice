# Supabase CLI config for the SudoVoice backend.
# `project_id` is only the LOCAL name for this project (container prefix for
# `supabase start`); linking to the hosted project uses `supabase link --project-ref`.
project_id = "sudovoice"

# Razorpay cannot attach a Supabase JWT, so the webhook must be public.
# Signature verification inside the function is the auth gate.
[functions.razorpay-webhook]
verify_jwt = false

# license-check requires a signed-in user's JWT at the gateway.
[functions.license-check]
verify_jwt = true
