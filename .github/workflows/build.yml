name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "backend/**"
      - "**.md"
  workflow_dispatch:

jobs:
  macos:
    name: macOS app (.dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build (release)
        run: swift build -c release

      - name: Package .app bundle + DMG
        run: |
          set -euo pipefail
          BIN="$(swift build -c release --show-bin-path)/SudoVoice"
          VERSION=$(plutil -extract CFBundleShortVersionString raw Sources/App/Info.plist)
          STAGING=.build/dmg/staging
          APP="$STAGING/SudoVoice.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$BIN" "$APP/Contents/MacOS/SudoVoice"
          cp Sources/App/Info.plist "$APP/Contents/"
          cp assets/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          codesign --force --sign - "$APP"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname SudoVoice -srcfolder "$STAGING" -ov -format UDZO ".build/SudoVoice.dmg"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          shasum -a 256 .build/SudoVoice.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: SudoVoice-macOS
          path: .build/SudoVoice.dmg
          if-no-files-found: error

  android:
    name: Android app (.apk)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SudoVoice-Android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  windows:
    name: Windows app (installer)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - name: Skip if Windows app not present yet
        id: gate
        shell: bash
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.present == 'true'
        with:
          node-version: "22"

      - name: Install dependencies
        if: steps.gate.outputs.present == 'true'
        run: npm ci

      - name: Build NSIS installer
        if: steps.gate.outputs.present == 'true'
        run: npx electron-builder --win nsis --publish never

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.present == 'true'
        with:
          name: SudoVoice-Windows
          path: windows/dist/SudoVoice-Setup.exe
          if-no-files-found: error
