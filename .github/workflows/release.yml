name: Release

# Tag a version (git tag v2.6.0 && git push --tags) or run manually.
# Builds all three platforms, publishes a GitHub Release with stable asset
# names (SudoVoice.dmg / SudoVoice-Setup.exe / SudoVoice.apk) so
# /releases/latest/download/<asset> URLs never change, and refreshes the
# update manifests in website/public/releases/.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS
    runs-on: macos-14
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      sha256: ${{ steps.pkg.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Build (release)
        run: swift build -c release
      - name: Package .app bundle + DMG
        id: pkg
        run: |
          set -euo pipefail
          BIN="$(swift build -c release --show-bin-path)/SudoVoice"
          VERSION=$(plutil -extract CFBundleShortVersionString raw Sources/App/Info.plist)
          STAGING=.build/dmg/staging
          APP="$STAGING/SudoVoice.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$BIN" "$APP/Contents/MacOS/SudoVoice"
          cp Sources/App/Info.plist "$APP/Contents/"
          cp assets/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          codesign --force --sign - "$APP"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname SudoVoice -srcfolder "$STAGING" -ov -format UDZO ".build/SudoVoice.dmg"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 .build/SudoVoice.dmg | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: .build/SudoVoice.dmg
          if-no-files-found: error

  android:
    name: Build Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"
      # Debug-signed for now (installable via sideload). Swap to a release
      # keystore secret (ANDROID_KEYSTORE_*) before Play Store submission.
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Rename to stable asset name
        run: cp app/build/outputs/apk/debug/app-debug.apk SudoVoice.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: android/SudoVoice.apk
          if-no-files-found: error

  windows:
    name: Build Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Build NSIS installer
        run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: windows/dist/SudoVoice-Setup.exe
          if-no-files-found: error

  publish:
    name: Publish release + manifests
    needs: [macos, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Compute checksums + manifests
        id: meta
        run: |
          set -euo pipefail
          VERSION="${{ needs.macos.outputs.version }}"
          DATE=$(date -u +%Y-%m-%d)
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download"
          NOTES="Bug fixes and improvements."
          [ -f RELEASE_NOTES.md ] && NOTES=$(cat RELEASE_NOTES.md)
          NOTES_JSON=$(printf '%s' "$NOTES" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read().strip()))")
          mkdir -p website/public/releases
          for f in dist/*; do sha256sum "$f"; done

          cat > website/public/releases/latest.json <<EOF
          {
            "version": "$VERSION",
            "minimumOS": "14.0",
            "releaseDate": "$DATE",
            "downloadURL": "$BASE/SudoVoice.dmg",
            "releaseNotes": $NOTES_JSON,
            "sha256": "$(sha256sum dist/SudoVoice.dmg | cut -d' ' -f1)"
          }
          EOF
          cat > website/public/releases/latest-windows.json <<EOF
          {
            "version": "$VERSION",
            "minimumOS": "10",
            "releaseDate": "$DATE",
            "downloadURL": "$BASE/SudoVoice-Setup.exe",
            "releaseNotes": $NOTES_JSON,
            "sha256": "$(sha256sum dist/SudoVoice-Setup.exe | cut -d' ' -f1)"
          }
          EOF
          cat > website/public/releases/latest-android.json <<EOF
          {
            "version": "$VERSION",
            "minimumOS": "8.0",
            "releaseDate": "$DATE",
            "downloadURL": "$BASE/SudoVoice.apk",
            "releaseNotes": $NOTES_JSON,
            "sha256": "$(sha256sum dist/SudoVoice.apk | cut -d' ' -f1)"
          }
          EOF
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
          name: SudoVoice v${{ steps.meta.outputs.version }}
          body_path: ${{ hashFiles('RELEASE_NOTES.md') != '' && 'RELEASE_NOTES.md' || '' }}
          files: |
            dist/SudoVoice.dmg
            dist/SudoVoice-Setup.exe
            dist/SudoVoice.apk

      - name: Commit update manifests to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add website/public/releases/*.json
          git diff --cached --quiet || git commit -m "release: update manifests for v${{ steps.meta.outputs.version }}"
          git push origin main
